name: Stuora iOS TestFlight staging candidate

# Deliberately manual: no push-triggered signed builds or automatic App Store release.
on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build signed iOS 0.1.6 candidate
    type: build
    params:
      platform: ios
      profile: testflight

  submit_ios:
    name: Upload build to Apple TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
