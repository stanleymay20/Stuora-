name: Stuora iOS TestFlight staging candidate

# Manual only. No push triggers, no public App Store release, no external groups.
on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build signed iOS 0.1.6 candidate
    type: build
    params:
      platform: ios
      profile: testflight
    hooks:
      after_install_node_modules:
        - name: Validate staging backend, origin and publishable key without printing values
          run: npm run check:environment

  submit_ios:
    name: Upload candidate for internal TestFlight testing
    needs: [build_ios]
    type: testflight
    # Expo defaults non-build jobs to the production environment; keep the
    # upload job on the same staging (preview) variables as the build.
    environment: preview
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: testflight
      submit_beta_review: false
      changelog: "Stuora 0.1.6 internal staging candidate: validate student sign-in, recovery deep links, privacy, profiles, listings and messaging."
