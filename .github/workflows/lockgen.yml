name: Generate image picker lockfile

on:
  push:
    branches:
      - ga/listing-media-ui

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ga/listing-media-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Add Expo-compatible image picker and refresh lockfile
        run: npm install expo-image-picker@~57.0.20 --package-lock-only --ignore-scripts
      - name: Install generated dependency graph
        run: npm ci --ignore-scripts
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add Expo image picker dependency [lockgen]"
          git push origin HEAD:ga/listing-media-ui
