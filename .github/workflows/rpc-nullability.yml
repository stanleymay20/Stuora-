name: Normalize save listing RPC nullability

on:
  push:
    branches:
      - ga/listing-media-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ga/listing-media-ui
      - name: Record the SQL function create sentinel in generated types
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/backend/database.types.ts')
          text = p.read_text()
          marker = '      save_student_listing: {\n        Args: {'
          start = text.index(marker)
          end = text.index('        Returns: string', start)
          block = text[start:end]
          old = '          p_id: string\n'
          if old not in block:
              raise SystemExit('expected save_student_listing p_id type not found')
          block = block.replace(old, '          p_id: string | null\n', 1)
          p.write_text(text[:start] + block + text[end:])
          PY
          git rm .github/workflows/rpc-nullability.yml
      - name: Commit normalized RPC contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/database.types.ts
          git commit -m "Record save listing RPC create nullability"
          git push origin HEAD:ga/listing-media-ui
