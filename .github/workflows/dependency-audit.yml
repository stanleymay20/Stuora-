name: Dependency audit

on:
  push:
    branches:
      - ga/dependency-hardening

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependency graph
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/prod-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/prod-audit.json', 'utf8'));
          const vulnerabilities = Object.fromEntries(Object.entries(report.vulnerabilities || {}).map(([name, value]) => [name, {
            severity: value.severity,
            isDirect: value.isDirect,
            via: (value.via || []).map(item => typeof item === 'string' ? item : ({ name: item.name, severity: item.severity, title: item.title, range: item.range, url: item.url })),
            effects: value.effects,
            range: value.range,
            fixAvailable: value.fixAvailable,
          }]));
          console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities }, null, 2));
          NODE
      - name: Audit full dependency graph summary
        shell: bash
        run: |
          npm audit --json > /tmp/full-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/full-audit.json', 'utf8'));
          console.log(JSON.stringify({ metadata: report.metadata }, null, 2));
          NODE
