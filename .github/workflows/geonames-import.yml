name: GeoNames import build

# Builds the Gismate Location Engine import from the OFFICIAL GeoNames dump.
# It never touches a database. It publishes places.tsv, names.tsv, begin.sql,
# activate.sql and manifest.json (with SHA-256 of every input and output) to the
# `geonames-data` branch under <version>/, and as a build artifact. Loading:
# docs/GISMATE_LOCATION_ENGINE.md.
on:
  push:
    branches: ['feature/location-engine-*']
    paths: ['scripts/geonames/**', '.github/workflows/geonames-import.yml']
  workflow_dispatch:

permissions:
  contents: write  # only to publish the generated dataset to the geonames-data branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Download official GeoNames files
        run: |
          mkdir -p geonames-in
          cd geonames-in
          for f in DE.zip admin1CodesASCII.txt admin2Codes.txt readme.txt; do
            curl -fsS --retry 3 -o "$f" "https://download.geonames.org/export/dump/$f"
          done
          unzip -o -q DE.zip DE.txt
          grep -q "Creative Commons Attribution 4.0" readme.txt
          sha256sum DE.zip DE.txt admin1CodesASCII.txt admin2Codes.txt | tee SHA256SUMS
      - name: Unit-test the importer
        run: node --test scripts/geonames/build-import.test.mjs
      - name: Build versioned import
        run: node scripts/geonames/build-import.mjs geonames-in geonames-out
      - name: Rebuild and prove it is reproducible
        run: |
          node scripts/geonames/build-import.mjs geonames-in geonames-out-2
          diff -r geonames-out geonames-out-2
      - name: Publish dataset to the geonames-data branch
        run: |
          version=$(node -p "require('./geonames-out/manifest.json').version")
          cp geonames-in/SHA256SUMS geonames-out/SOURCE-SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/geonames-data >/dev/null; then
            git fetch --depth=1 origin geonames-data
            git worktree add data FETCH_HEAD
            git -C data checkout -B geonames-data
          else
            git worktree add --detach data
            git -C data checkout --orphan geonames-data
            git -C data rm -rfq .
          fi
          rm -rf "data/$version" && mkdir -p "data/$version" && cp geonames-out/* "data/$version/"
          printf '%s\n' "Generated by .github/workflows/geonames-import.yml from the official GeoNames dump." \
            "Data: GeoNames (https://www.geonames.org/), Creative Commons Attribution 4.0." > data/README.md
          git -C data add -A
          if git -C data diff --cached --quiet; then echo "unchanged: $version"; exit 0; fi
          git -C data commit -qm "GeoNames dataset $version (built from ${GITHUB_SHA::7})"
          git -C data push origin HEAD:refs/heads/geonames-data
      - uses: actions/upload-artifact@v4
        with:
          name: geonames-import
          path: |
            geonames-out
            geonames-in/SHA256SUMS
          retention-days: 30
