name: Stuora CI

on:
  push:
    branches: [main, feat/mvp-shell]
  pull_request:
    # Also gate stacked PRs that target a feature branch (e.g. remediation PRs).
    branches: [main, 'feat/**']

jobs:
  # Independent authorization gate: never hide RLS failures behind an npm audit
  # network timeout. The original audit and full verify gate remain mandatory.
  rls-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm ci
      - name: Test database authorization
        run: npm run test:database

  # Independent Deno runtime gate. Expo's TypeScript settings do not understand
  # Deno's npm:/jsr: module specifiers and cannot prove Edge Function readiness.
  trusted-media-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck trusted media Edge Function
        run: deno check --config supabase/functions/listing-photo-intake/deno.json supabase/functions/listing-photo-intake/index.ts

      - name: Test real WASM JPEG PNG WebP media codecs (local Deno runtime)
        run: deno test --allow-read --config supabase/functions/listing-photo-intake/deno.json supabase/functions/listing-photo-intake/processor.test.ts

      - name: Typecheck account deletion, AI assistant and external data Edge Functions
        shell: bash
        run: |
          deno --version
          set +e
          deno check --config supabase/functions/deno.json supabase/functions/delete-account/index.ts supabase/functions/stuora-assistant/index.ts supabase/functions/external-data/index.ts 2>&1 | tee /tmp/deno-check.log
          status=${PIPESTATUS[0]}
          # Surface type errors as annotations so they are readable without raw logs.
          if [ "$status" -ne 0 ]; then sed 's/\x1b\[[0-9;]*m//g' /tmp/deno-check.log | grep -E 'TS[0-9]+|error|at file' | head -30 | sed 's/^/::error::/'; fi
          exit $status

      - name: Test account deletion, AI grounding, provider licensing and intent parity
        run: deno test --allow-read --config supabase/functions/deno.json supabase/functions/_shared supabase/functions/delete-account supabase/functions/external-data supabase/functions/stuora-assistant

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_STUORA_ENV: test
      EXPO_PUBLIC_SUPABASE_URL: https://stuora-test.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm ci

      - name: Test dependency security failure paths
        run: node --test tests/dependency-security.test.mjs

      - name: Audit production dependency baseline
        run: node scripts/audit-production.mjs

      - name: Bound Edge JSON bodies and reject stalled uploads
        run: node --test tests/edge-http.test.mjs

      - name: Test environment isolation
        run: node --test tests/backend-config.test.mjs

      - name: Test isolated Vercel preview origin binding
        run: node --test tests/vercel-preview-origin.test.mjs

      - name: Validate Stuora Auth email and branded error copy
        run: node --test tests/auth-branding.test.mjs

      - name: Reject direct public photo uploads in Stuora clients
        run: node --test tests/media-client-lockdown.test.mjs

      - name: Test staging media denial harness without account credentials
        run: node --test tests/media-quarantine-http.test.mjs

      - name: Gate real two-student acceptance to exact approved staging preview
        run: node --test tests/hosted-preview-identity.test.mjs

      - name: Reject malicious native Auth deep links (PKCE only)
        run: node --test tests/native-auth-callback.test.mjs tests/native-pkce.test.mjs tests/auth-callback-notice.test.mjs

      - name: Refuse production builds with placeholder legal pages
        run: node --test tests/legal-config.test.mjs

      - name: Test secret scanner
        run: node --test tests/secret-scan.test.mjs

      - name: Scan repository for committed secrets
        run: node scripts/scan-secrets.mjs

      - name: Verify staging-only Auth template rollout procedure
        run: node --test tests/auth-branding-rollout.test.mjs

      - name: Generate and verify Stuora native branding assets
        run: node --test tests/native-branding.test.mjs

      - name: Validate build environment
        run: npm run check:environment


      - name: Test database authorization
        run: npm run test:database

      - name: Typecheck
        run: npm run typecheck

      - name: Export web build
        run: npm run export:web

      - name: Scan web bundle for leaked secrets
        run: node scripts/scan-secrets.mjs

      - name: Install browser for account regression tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile web account flows
        run: npm run test:web

      - name: Export native bundles
        run: npx expo export --platform ios --platform android --output-dir native-build

      # A published-SDK/version-index skew must never hide independent test failures.
      # Keep this a mandatory failing gate; evaluate it after all independent checks.
      - name: Check Expo dependency compatibility
        run: npx expo install --check
