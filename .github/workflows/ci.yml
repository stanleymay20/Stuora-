name: Stuora CI

on:
  push:
    branches: [main, feat/mvp-shell]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_STUORA_ENV: test
      EXPO_PUBLIC_SUPABASE_URL: https://stuora-test.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm ci

      - name: Test dependency security failure paths
        run: node --test tests/dependency-security.test.mjs

      - name: Audit production dependency baseline
        run: node scripts/audit-production.mjs

      - name: Test environment isolation
        run: node --test tests/backend-config.test.mjs

      - name: Validate build environment
        run: npm run check:environment


      - name: Test database authorization
        run: npm run test:database

      - name: Typecheck
        run: npm run typecheck

      - name: Export web build
        run: npm run export:web

      - name: Install browser for account regression tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile web account flows
        run: npm run test:web

      - name: Export native bundles
        run: npx expo export --platform ios --platform android --output-dir native-build

      # A published-SDK/version-index skew must never hide independent test failures.
      # Keep this a mandatory failing gate; evaluate it after all independent checks.
      - name: Check Expo dependency compatibility
        run: npx expo install --check
