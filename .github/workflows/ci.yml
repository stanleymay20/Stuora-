name: Stuora CI

on:
  push:
    branches: [main, feat/mvp-shell]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Test database authorization
        run: npm run test:database

      - name: Typecheck
        run: npm run typecheck

      - name: Export web build
        run: npm run export:web

      - name: Install browser for account regression tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile web account flows
        run: npm run test:web

      - name: Export native bundles
        run: npx expo export --platform ios --platform android --output-dir native-build
