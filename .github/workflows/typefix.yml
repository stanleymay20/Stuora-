name: Normalize regenerated types

on:
  push:
    branches:
      - ga/listing-media-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ga/listing-media-ui
      - name: Correct generated helper and remove this one-off workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/backend/database.types.ts')
          text = p.read_text()
          old = 'DatabaseWithoutInternals[DefaultSchemaEnumNameOrOptions["schema"]]["CompositeTypes"]'
          new = 'DatabaseWithoutInternals[PublicCompositeTypeNameOrOptions["schema"]]["CompositeTypes"]'
          if old not in text:
              raise SystemExit('expected generated helper text not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/typefix.yml
      - name: Commit normalized generated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/database.types.ts
          git commit -m "Normalize regenerated database type helper"
          git push origin HEAD:ga/listing-media-ui
