name: Safe dependency lockfile fix

on:
  push:
    branches:
      - ga/dependency-hardening

permissions:
  contents: write

jobs:
  lockfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ga/dependency-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply non-breaking npm advisory updates to lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Install resulting graph
        run: npm ci --ignore-scripts
      - name: Verify Expo SDK compatibility
        run: npx expo install --check
      - name: Show remaining production audit summary
        run: npm audit --omit=dev || true
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Apply safe dependency advisory updates [lockfix]"
          git push origin HEAD:ga/dependency-hardening
