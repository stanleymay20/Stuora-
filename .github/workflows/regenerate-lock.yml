name: Regenerate lockfile

on:
  push:
    branches:
      - fix/vercel-static-hosting

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-static-hosting
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify Expo compatibility
        run: |
          npm ci
          npx expo install --check
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "Regenerate lockfile for Expo SDK 57 patches"
          git push origin HEAD:fix/vercel-static-hosting
